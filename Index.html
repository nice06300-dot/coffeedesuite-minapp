<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coffee de Suite</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #aaa;
      margin-top: 8px;
    }

    .catalogue {
      padding: 15px;
      max-width: 600px;
      margin: auto;
    }

    .produit {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .image {
      height: 150px;
      background: #292929;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    .prix {
      font-size: 22px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>COFFEE DE SUITE</h1>
  <div class="subtitle">Catalogue test</div>
</header>

<div class="catalogue">

  <div class="produit">
    <div class="image">📦</div>
    <h2>Produit test 1</h2>
    <p>Description du produit.</p>
    <p class="prix">19,90 €</p>
    <button>Voir le produit</button>
  </div>

  <div class="produit">
    <div class="image">📦</div>
    <h2>Produit test 2</h2>
    <p>Description du produit.</p>
    <p class="prix">29,90 €</p>
    <button>Voir le produit</button>
  </div>

  <div class="produit">
    <div class="image">📦</div>
    <h2>Produit test 3</h2>
    <p>Description du produit.</p>
    <p class="prix">39,90 €</p>
    <button>Voir le produit</button>
  </div>

</div>

</body>
</html>
