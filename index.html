<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07090d">

  <title>Coffee de Suite</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at top, #142238 0%, #090c12 38%, #050609 75%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 28px 22px 60px;
    }

    /* EMBLÈME */

    .hero {
      text-align: center;
      padding-top: 8px;
      margin-bottom: 40px;
    }

    .logo {
      width: min(78vw, 360px);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: auto;

      border: 2px solid rgba(70, 174, 255, 0.75);

      box-shadow:
        0 0 25px rgba(42, 147, 255, 0.25),
        0 15px 50px rgba(0, 0, 0, 0.55);
    }

    /* CATALOGUE */

    .catalogue-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.7px;
      margin-bottom: 22px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .product {
      overflow: hidden;
      border-radius: 24px;
      background: linear-gradient(
        145deg,
        rgba(28, 32, 42, 0.96),
        rgba(14, 16, 22, 0.96)
      );

      border: 1px solid rgba(255,255,255,0.09);

      box-shadow:
        0 12px 30px rgba(0,0,0,0.28);
    }

    .product-image {
      height: 185px;

      background:
        radial-gradient(
          circle at 50% 35%,
          #252b39 0%,
          #171b25 55%,
          #11141b 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 48px;
      color: rgba(255,255,255,0.28);
    }

    .product-info {
      padding: 18px 16px 21px;
    }

    .coming {
      color: #8d93a1;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 9px;
    }

    .product h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .product p {
      color: #747b89;
      font-size: 14px;
      line-height: 1.4;
    }

    .bottom-message {
      margin-top: 30px;
      padding: 24px 20px;
      text-align: center;

      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
    }

    .bottom-message strong {
      display: block;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .bottom-message span {
      color: #7f8591;
      font-size: 14px;
    }

    @media (max-width: 380px) {
      .container {
        padding-left: 16px;
        padding-right: 16px;
      }

      .products {
        gap: 12px;
      }

      .product-image {
        height: 160px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="hero">
      <img
        class="logo"
        src="65A9C388-991F-4901-9DD3-24C7876EA2F1.png"
        alt="Coffee de Suite"
      >
    </section>

    <section>

      <h1 class="catalogue-title">Catalogue</h1>

      <div class="products">

        <article class="product">
          <div class="product-image">+</div>

          <div class="product-info">
            <div class="coming">À VENIR</div>
            <h2>Produit 01</h2>
            <p>Emplacement réservé.</p>
          </div>
        </article>


        <article class="product">
          <div class="product-image">+</div>

          <div class="product-info">
            <div class="coming">À VENIR</div>
            <h2>Produit 02</h2>
            <p>Emplacement réservé.</p>
          </div>
        </article>


        <article class="product">
          <div class="product-image">+</div>

          <div class="product-info">
            <div class="coming">À VENIR</div>
            <h2>Produit 03</h2>
            <p>Emplacement réservé.</p>
          </div>
        </article>


        <article class="product">
          <div class="product-image">+</div>

          <div class="product-info">
            <div class="coming">À VENIR</div>
            <h2>Produit 04</h2>
            <p>Emplacement réservé.</p>
          </div>
        </article>

      </div>

      <div class="bottom-message">
        <strong>Catalogue en préparation</strong>
        <span>Les contenus seront ajoutés prochainement.</span>
      </div>

    </section>

  </main>

</body>
</html>
