<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Coffee de Suite</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #05080d;
      --card: #0d131c;
      --card2: #111a25;
      --border: rgba(255,255,255,.08);
      --text: #ffffff;
      --muted: #929baa;
      --blue: #168cff;
      --blue2: #006ee6;
      --green: #25D366;
    }

    html {
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #10243d 0%, #08111d 27%, #05080d 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    body.modal-open {
      overflow: hidden;
      touch-action: none;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 25px 16px 45px;
    }

    /* ===== EMBLÈME ===== */

    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5px 0 25px;
    }

    .logo {
      display: block;
      width: min(70vw, 320px);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(22,140,255,.55);
      box-shadow:
        0 0 25px rgba(22,140,255,.20),
        0 20px 50px rgba(0,0,0,.50);
    }

    /* ===== CATALOGUE ===== */

    .catalogue-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 13px;
    }

    .product {
      background:
        linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.01)),
        var(--card);
      border: 1px solid var(--border);
      border-radius: 19px;
      overflow: hidden;
      cursor: pointer;
      transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease;
    }

    .product:active {
      transform: scale(.975);
      border-color: rgba(22,140,255,.45);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background:
        radial-gradient(circle at center, #182536, #0b1119 72%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: rgba(255,255,255,.25);
      font-size: 38px;
      font-weight: 200;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 13px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-short {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      min-height: 34px;
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .product-button {
      width: 100%;
      padding: 10px 8px;
      border-radius: 11px;
      background: rgba(22,140,255,.12);
      border: 1px solid rgba(22,140,255,.25);
      color: #58aaff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    /* ===== MODALE ===== */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      display: flex;
      justify-content: center;
      align-items: flex-end;

      opacity: 0;
      visibility: hidden;
      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      position: relative;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      overscroll-behavior: contain;

      background:
        linear-gradient(180deg, #121a25 0%, #080c12 100%);
      border: 1px solid rgba(255,255,255,.10);
      border-bottom: none;

      border-radius: 28px 28px 0 0;

      padding:
        12px
        18px
        calc(24px + env(safe-area-inset-bottom));

      transform: translateY(100%);
      transition: transform .32s cubic-bezier(.2,.8,.2,1);

      will-change: transform;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .drag-handle {
      width: 42px;
      height: 5px;
      border-radius: 20px;
      background: rgba(255,255,255,.25);
      margin: 0 auto 15px;
    }

    .close-button {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.48);
      color: white;
      font-size: 23px;
      line-height: 32px;
      cursor: pointer;
      z-index: 5;
    }

    .modal-image {
      width: 100%;
      aspect-ratio: 1.25 / 1;
      border-radius: 20px;
      overflow: hidden;

      background:
        radial-gradient(circle at center, #1b2b3e, #0a1018 72%);

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(255,255,255,.22);
      font-size: 48px;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-details {
      padding: 20px 3px 5px;
    }

    .modal-name {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
      padding-right: 10px;
    }

    .modal-price {
      margin-top: 8px;
      font-size: 22px;
      font-weight: 800;
      color: #62aeff;
    }

    .modal-description {
      margin-top: 17px;
      color: #b0b7c2;
      font-size: 14px;
      line-height: 1.65;
    }

    /* ===== CONTACT ===== */

    .contact-title {
      margin-top: 25px;
      margin-bottom: 11px;
      color: #8d96a4;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .contact-buttons {
      display: grid;
      gap: 10px;
    }

    .contact-button {
      min-height: 52px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-decoration: none;
      color: white;
      font-size: 15px;
      font-weight: 750;
      transition: transform .15s ease;
    }

    .contact-button:active {
      transform: scale(.98);
    }

    .telegram {
      background: linear-gradient(135deg, #2496e8, #087ac7);
      box-shadow: 0 10px 25px rgba(0,136,204,.15);
    }

    .whatsapp {
      background: linear-gradient(135deg, #27d367, #159447);
      box-shadow: 0 10px 25px rgba(37,211,102,.12);
    }

    .contact-icon {
      font-size: 18px;
    }

    @media (min-width: 480px) {
      .products {
        gap: 16px;
      }

      .product-info {
        padding: 15px;
      }
    }
  </style>
</head>


<body>

  <main class="container">

    <div class="hero">
      <img
        class="logo"
        src="65A9C388-991F-4901-9DD3-24C7876EA2F1.png"
        alt="Coffee de Suite"
      >
    </div>

    <h1 class="catalogue-title">Catalogue</h1>

    <section class="products" id="products"></section>

  </main>


  <!-- ===== FICHE PRODUIT ===== -->

  <div class="modal" id="productModal">

    <div class="modal-content" id="modalContent">

      <div class="drag-handle"></div>

      <button
        class="close-button"
        id="closeButton"
        aria-label="Fermer"
      >
        ×
      </button>

      <div class="modal-image" id="modalImage">
        +
      </div>

      <div class="modal-details">

        <div class="modal-name" id="modalName"></div>

        <div class="modal-price" id="modalPrice"></div>

        <div
          class="modal-description"
          id="modalDescription"
        ></div>

        <div class="contact-title">
          Nous contacter
        </div>

        <div class="contact-buttons">

          <a
            class="contact-button telegram"
            id="telegramButton"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="contact-icon">✈</span>
            Contacter sur Telegram
          </a>

          <a
            class="contact-button whatsapp"
            id="whatsappButton"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="contact-icon">●</span>
            Contacter sur WhatsApp
          </a>

        </div>

      </div>

    </div>

  </div>


<script>

  /*
  ==================================================
       PRODUITS

       PLUS TARD, C'EST PRINCIPALEMENT CETTE
       PARTIE QUE TU MODIFIERAS.
  ==================================================
  */

  const products = [

    {
      name: "Produit 01",
      price: "00,00 €",
      short: "Description du produit.",
      description:
        "Description complète du produit 01. Les informations détaillées seront affichées ici.",
      image: ""
    },

    {
      name: "Produit 02",
      price: "00,00 €",
      short: "Description du produit.",
      description:
        "Description complète du produit 02. Les informations détaillées seront affichées ici.",
      image: ""
    },

    {
      name: "Produit 03",
      price: "00,00 €",
      short: "Description du produit.",
      description:
        "Description complète du produit 03. Les informations détaillées seront affichées ici.",
      image: ""
    },

    {
      name: "Produit 04",
      price: "00,00 €",
      short: "Description du produit.",
      description:
        "Description complète du produit 04. Les informations détaillées seront affichées ici.",
      image: ""
    }

  ];


  /*
  ==================================================
       CONTACTS
  ==================================================
  */

  const TELEGRAM_USERNAME = "coffeedesuite06";

  const WHATSAPP_NUMBER = "33775426696";


  /*
  ==================================================
       CRÉATION AUTOMATIQUE DU CATALOGUE
  ==================================================
  */

  const productsContainer =
    document.getElementById("products");


  function createCatalogue() {

    productsContainer.innerHTML = "";

    products.forEach((product, index) => {

      const card = document.createElement("article");

      card.className = "product";
      card.tabIndex = 0;
      card.setAttribute("role", "button");

      card.innerHTML = `

        <div class="product-image">

          ${
            product.image
              ? `<img src="${product.image}" alt="${product.name}">`
              : "+"
          }

        </div>

        <div class="product-info">

          <div class="product-name">
            ${product.name}
          </div>

          <div class="product-short">
            ${product.short}
          </div>

          <div class="product-price">
            ${product.price}
          </div>

          <div class="product-button">
            Voir le produit
          </div>

        </div>
      `;


      card.addEventListener("click", () => {
        openProduct(index);
      });


      card.addEventListener("keydown", event => {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          event.preventDefault();
          openProduct(index);
        }

      });


      productsContainer.appendChild(card);

    });

  }


  /*
  ==================================================
       OUVERTURE PRODUIT
  ==================================================
  */

  const modal =
    document.getElementById("productModal");

  const modalContent =
    document.getElementById("modalContent");

  const modalImage =
    document.getElementById("modalImage");

  const modalName =
    document.getElementById("modalName");

  const modalPrice =
    document.getElementById("modalPrice");

  const modalDescription =
    document.getElementById("modalDescription");

  const telegramButton =
    document.getElementById("telegramButton");

  const whatsappButton =
    document.getElementById("whatsappButton");


  function openProduct(index) {

    const product = products[index];


    modalName.textContent =
      product.name;

    modalPrice.textContent =
      product.price;

    modalDescription.textContent =
      product.description;


    if (product.image) {

      modalImage.innerHTML =
        `<img src="${product.image}" alt="${product.name}">`;

    } else {

      modalImage.innerHTML = "+";

    }


    /*
       MESSAGE PRÉREMPLI
    */

    const message =
      `Bonjour, je vous contacte au sujet de ${product.name}.`;


    /*
       TELEGRAM
    */

    telegramButton.href =
      `https://t.me/${TELEGRAM_USERNAME}`;


    /*
       WHATSAPP
    */

    whatsappButton.href =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;


    modal.classList.add("active");

    document.body.classList.add("modal-open");

  }


  /*
  ==================================================
       FERMETURE
  ==================================================
  */

  function closeProduct() {

    modal.classList.remove("active");

    document.body.classList.remove("modal-open");

    modalContent.style.transition = "";

    modalContent.style.transform = "";

  }


  document
    .getElementById("closeButton")
    .addEventListener("click", closeProduct);


  modal.addEventListener("click", event => {

    if (event.target === modal) {
      closeProduct();
    }

  });


  document.addEventListener("keydown", event => {

    if (
      event.key === "Escape" &&
      modal.classList.contains("active")
    ) {
      closeProduct();
    }

  });


  /*
  ==================================================
       GLISSER VERS LE BAS POUR FERMER
  ==================================================
  */

  let touchStartY = 0;
  let touchCurrentY = 0;
  let dragging = false;


  modalContent.addEventListener(
    "touchstart",
    event => {

      /*
        Le glissement démarre seulement
        lorsque la fiche est en haut.
      */

      if (modalContent.scrollTop > 0) {
        return;
      }

      touchStartY =
        event.touches[0].clientY;

      touchCurrentY =
        touchStartY;

      dragging = true;

      modalContent.style.transition = "none";

    },
    { passive: true }
  );


  modalContent.addEventListener(
    "touchmove",
    event => {

      if (!dragging) return;

      touchCurrentY =
        event.touches[0].clientY;

      const distance =
        touchCurrentY - touchStartY;


      if (distance > 0) {

        modalContent.style.transform =
          `translateY(${distance}px)`;

      }

    },
    { passive: true }
  );


  modalContent.addEventListener(
    "touchend",
    () => {

      if (!dragging) return;

      dragging = false;

      const distance =
        touchCurrentY - touchStartY;


      modalContent.style.transition =
        "transform .25s ease";


      if (distance > 90) {

        closeProduct();

      } else {

        modalContent.style.transform =
          "translateY(0)";

      }

    }
  );


  /*
  ==================================================
       LANCEMENT
  ==================================================
  */

  createCatalogue();

</script>

</body>
</html>
